sonar.projectKey=thaw-app_Floe
sonar.organization=thaw-app

# The name and version shown in SonarQube Cloud.
# Keep the version in sync with CFBundleShortVersionString in project.yml.
sonar.projectName=Floe
sonar.projectVersion=0.1.0

sonar.sources=Sources,runtime,scripts
sonar.tests=Tests,runtime
sonar.test.inclusions=Tests/**,runtime/tests/**,runtime/smoke.ts,runtime/survey.ts,runtime/testing.ts

# Vendor/ThawUI and Vendor/ThawConcurrency are unmodified copies of Thaw's packages and are analysed in
# Thaw's own project.
# extensions/ holds a sample and commands that fail on purpose to exercise the error screen.
# The runtime's tests and headless scripts are listed as tests above, so they leave the sources.
sonar.exclusions=\
  Vendor/**,extensions/**,**/node_modules/**,Floe.xcodeproj/**,\
  runtime/tests/**,runtime/smoke.ts,runtime/survey.ts,runtime/testing.ts

# Coverage report paths are passed by CI (see ci.yml), because the reports exist only when a run
# built or restored them: coverage/swift.xml and coverage/runtime/lcov.info, from scripts/coverage.sh.

# Coverage exclusions.
#
# Rule (Thaw's): a file is excluded only when its substance cannot run in a unit test: SwiftUI
# view bodies, NSPanel and window wiring, the app entry point, Carbon hotkey registration,
# Accessibility and ScreenCaptureKit, the Keychain and login item, spawning the Bun process,
# and scanning the real Applications and extension folders.
#
# The logic those files used to hold lives in measured files with their own suites: Ranking,
# Manifest, ViewState, MarkdownParser, Shortcuts, PropFormat, Preferences, MenuBarLogic, Settings,
# Session, CommandLookup, UpdateLogic, SettingsSearchEntries, and under Thaw/: ThawHUDPlacement,
# UpdateChannel, Onboarding/OnboardingSequencer, Permissions/Permission and AppPermissions, and
# SettingsSearch (index, ranker, model, navigation). New decision logic belongs there, not in the
# excluded files.
#
#   Model.swift             panel state wired to NSWorkspace, the pasteboard and key events
#   Catalog.swift           Paths and scans of the real file system, plus the folder watcher
#   Session+Process.swift   the Bun process and its pipes; message handling is in Session.swift
#   SystemStores.swift      Keychain, preference files in Application Support, login item
#   MenuBarItems.swift      Accessibility walk and screen capture
#   Thaw/ThawHUD.swift      the HUD's NSPanel and its view; where it sits is in ThawHUDPlacement.swift
#   Thaw/FloeIntents.swift  App Intents glue the system calls; command matching is in CommandLookup.swift
#   Thaw/Onboarding/**      onboarding views; the step order is in OnboardingSequencer.swift, measured
#   Thaw/Permissions/       PermissionViews and PermissionsWindow only; Permission and AppPermissions are measured
#   AISettingsSection.swift General's AI section, a view; the choice it edits is in HostRequest.swift, measured
#   Thaw/Updates.swift      Sparkle's updater and its delegates; the decisions are in UpdateLogic.swift
#                           and Thaw/UpdateChannel.swift, which are measured
#   runtime/host.ts         entry script: argv, stdin and process.exit at top level
#   scripts/**              shell and build helpers
sonar.coverage.exclusions=\
  Sources/Floe/main.swift,Sources/Floe/Model.swift,Sources/Floe/Catalog.swift,\
  Sources/Floe/Session+Process.swift,Sources/Floe/SystemStores.swift,Sources/Floe/MenuBarItems.swift,\
  Sources/Floe/Views.swift,Sources/Floe/FormViews.swift,Sources/Floe/SettingsView.swift,\
  Sources/Floe/ErrorView.swift,Sources/Floe/MenuBarSearchView.swift,\
  Sources/Floe/Thaw/SearchPanelStyle.swift,Sources/Floe/Thaw/AboutSettingsPane.swift,\
  Sources/Floe/Thaw/HotkeyRecorder.swift,Sources/Floe/Thaw/HotkeyRegistry.swift,\
  Sources/Floe/Thaw/ThawHUD.swift,Sources/Floe/Thaw/FloeIntents.swift,\
  Sources/Floe/Thaw/Permissions/PermissionViews.swift,Sources/Floe/Thaw/Permissions/PermissionsWindow.swift,\
  Sources/Floe/Thaw/Onboarding/OnboardingView.swift,Sources/Floe/Thaw/Onboarding/OnboardingWelcomeView.swift,\
  Sources/Floe/Thaw/Onboarding/OnboardingPermissionsView.swift,Sources/Floe/Thaw/Onboarding/OnboardingStepIndicator.swift,\
  Sources/Floe/Thaw/Onboarding/GlassSupport.swift,Sources/Floe/OnboardingTourView.swift,\
  Sources/Floe/PermissionsSettingsSection.swift,Sources/Floe/AISettingsSection.swift,\
  Sources/Floe/Thaw/SettingsSearch/SearchViews.swift,\
  Sources/Floe/Thaw/Updates.swift,Sources/Floe/Thaw/UpdateConsentSheet.swift,\
  runtime/host.ts,scripts/**
