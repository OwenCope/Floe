name: "Block Translation (PRs)"

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "**/*.xcstrings"

permissions:
  contents: read

jobs:
  block-manual-translations:
    if: github.repository == 'thaw-app/Floe'
    runs-on: ubuntu-slim
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Close PR and Comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |

            const pr = context.payload.pull_request;
            if (!pr) return;

            if ((pr.title || '').toLowerCase().includes('crowdin')) return;
            
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
            });

            const onlyTranslations = files.every(f => f.filename.endsWith('.xcstrings'));
            if (!onlyTranslations) return;

            const message = [
              '### Manual translation detected',
              '',
              'Thank you very much for your contribution. Floe is translated on Crowdin: https://crowdin.com/project/floe',
              '',
              'Please contribute your translations there. A translation edited here conflicts with the ones that arrive from Crowdin and can overwrite other languages.',
              '',
              'Thank you for your understanding.',
              '',
              'This PR is being automatically closed to keep the localization sync intact.',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: message
            });

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              state: 'closed'
            });
