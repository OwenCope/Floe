name: Checkout source
description: Check out this repository and report its release build settings.

inputs:
  ref:
    description: Branch, tag, or commit to check out (empty = triggering commit)
    required: false
    default: ""
  fetch-depth:
    description: Passed to actions/checkout
    required: false
    default: "1"
  path:
    description: Checkout directory relative to GITHUB_WORKSPACE
    required: false
    default: "."

outputs:
  repository:
    description: owner/name that was checked out
    value: ${{ github.repository }}
  commit:
    description: Full commit SHA that was checked out
    value: ${{ steps.meta.outputs.commit }}
  project-name:
    description: Xcode project to build
    value: ${{ steps.meta.outputs.project_name }}
  deployment-target:
    description: MACOSX_DEPLOYMENT_TARGET from the app's Release configuration
    value: ${{ steps.meta.outputs.deployment_target }}

runs:
  using: composite
  steps:
    # Release tags can predate the workflow's local actions. Keep the whole
    # directory for later steps and the runner's post-job cleanup.
    - name: Set build actions aside
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        rm -rf "$RUNNER_TEMP/floe-build-actions"
        cp -R "$(dirname "$ACTION_PATH")" "$RUNNER_TEMP/floe-build-actions"

    - name: Checkout source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.ref || github.sha }}
        fetch-depth: ${{ inputs.fetch-depth }}
        path: ${{ inputs.path }}
        persist-credentials: false

    - name: Restore build actions
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        actions_dir="$(dirname "$ACTION_PATH")"
        mkdir -p "$(dirname "$actions_dir")"
        rm -rf "$actions_dir"
        cp -R "$RUNNER_TEMP/floe-build-actions" "$actions_dir"

    - name: Resolve build settings
      id: meta
      shell: bash
      env:
        SOURCE_PATH: ${{ inputs.path }}
      run: |
        set -euo pipefail
        project_name="Floe.xcodeproj"
        if [[ "$SOURCE_PATH" != "." ]]; then
          project_name="${SOURCE_PATH%/}/$project_name"
        fi
        # Read the checked-out app's target, not the dispatch branch's settings
        # or a hard-coded OS version that could lower a newer release's minimum.
        # XcodeGen writes the deployment target on the project, so fall back to
        # the project's Release configuration when the target does not set it.
        project_json="$RUNNER_TEMP/floe-project.json"
        plutil -convert json -o "$project_json" "$project_name/project.pbxproj"
        deployment_target="$(python3 - "$project_json" <<'PY'
        import json, sys

        objects = json.load(open(sys.argv[1]))["objects"]

        def release_settings(owner):
            configs = objects[owner["buildConfigurationList"]]["buildConfigurations"]
            release = next(objects[c] for c in configs if objects[c]["name"] == "Release")
            return release["buildSettings"]

        target = next(o for o in objects.values()
                      if o.get("isa") == "PBXNativeTarget" and o.get("name") == "Floe")
        project = next(o for o in objects.values() if o.get("isa") == "PBXProject")
        key = "MACOSX_DEPLOYMENT_TARGET"
        print(release_settings(target).get(key) or release_settings(project)[key])
        PY
        )"
        test -n "$deployment_target"
        commit="$(git -C "$SOURCE_PATH" rev-parse HEAD)"
        {
          echo "commit=$commit"
          echo "project_name=$project_name"
          echo "deployment_target=$deployment_target"
        } >> "$GITHUB_OUTPUT"
        echo "Checked out $GITHUB_REPOSITORY@$commit (macOS $deployment_target)"
