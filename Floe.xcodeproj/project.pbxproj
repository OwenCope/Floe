			shellScript = "set -euo pipefail\n# Copies the extension host and its React dependencies into the app, plus Bun itself,\n# so the installed app runs without this checkout or a system Bun.\nDEST=\"$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/runtime\"\nif [ ! -d \"$SRCROOT/runtime/node_modules/react-reconciler\" ]; then\n  echo \"error: runtime dependencies are missing; run 'bun install' in runtime/\"\n  exit 1\nfi\nmkdir -p \"$DEST/bin\"\nrsync -a --delete --exclude smoke.ts --exclude survey.ts --exclude testing.ts --exclude tests --exclude bunfig.toml --exclude bin \"$SRCROOT/runtime/\" \"$DEST/\"\n# rsync leaves excluded names alone, so drop test files an earlier build copied.\nrm -rf \"$DEST/tests\" \"$DEST/bunfig.toml\" \"$DEST/testing.ts\"\nBUN=\"\"\nfor candidate in \"${BUN_PATH:-}\" /opt/homebrew/bin/bun \"$HOME/.bun/bin/bun\" /usr/local/bin/bun; do\n  if [ -n \"$candidate\" ] && [ -x \"$candidate\" ]; then BUN=$(realpath \"$candidate\"); break; fi\ndone\nif [ -n \"$BUN\" ]; then\n  cmp -s \"$BUN\" \"$DEST/bin/bun\" || cp -f \"$BUN\" \"$DEST/bin/bun\"\nelse\n  echo \"warning: Bun not found; the app will look for a system copy at runtime\"\nfi\n# Stamp the commit into the built Info.plist for the About page; signing happens after this step.\nCOMMIT=$(git -C \"$SRCROOT\" rev-parse --short HEAD 2>/dev/null || echo \"uncommitted\")\nif [ -n \"$(git -C \"$SRCROOT\" status --porcelain 2>/dev/null | head -1)\" ]; then COMMIT=\"$COMMIT-dirty\"; fi\n/usr/libexec/PlistBuddy -c \"Set :GitCommitSHA $COMMIT\" \"$TARGET_BUILD_DIR/$INFOPLIST_PATH\"\n";
		};
